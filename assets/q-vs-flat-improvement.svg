<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Q-Arbor versus Flat Agent direction-normalized improvement</title>
  <desc id="desc">Horizontal bars show Q-Arbor's task-local, direction-normalized percentage improvement over Flat Agent across seven tasks. Q-Arbor leads on Bike, Hull, JPX, and Walmart; Flat leads on Recruit, Optiver, and Web Traffic.</desc>
  <defs>
    <style>
      .title{font:700 29px Inter,Segoe UI,Arial,sans-serif;fill:#173B57}
      .sub{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#5C6770}
      .task{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#173B57}
      .tick{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#7A858C}
      .val{font:700 13px Inter,Segoe UI,Arial,sans-serif}
      .grid{stroke:#D9E1E5;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#FAFCFD"/>
  <text x="55" y="55" class="title">Q-Arbor vs Flat Agent</text>
  <text x="55" y="82" class="sub">Direction-normalized task-local improvement (%) · positive values favor Q-Arbor</text>

  <rect x="905" y="30" width="240" height="76" rx="14" fill="#EEF3F5" stroke="#C6D2D8"/>
  <text x="1025" y="58" text-anchor="middle" style="font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#173B57">4 wins · 3 losses</text>
  <text x="1025" y="84" text-anchor="middle" class="sub">mean +1.05 · median +1.63</text>

  <text x="270" y="125" text-anchor="middle" class="tick">−5</text>
  <text x="375" y="125" text-anchor="middle" class="tick">−2.5</text>
  <text x="480" y="125" text-anchor="middle" class="tick">0</text>
  <text x="585" y="125" text-anchor="middle" class="tick">+2.5</text>
  <text x="690" y="125" text-anchor="middle" class="tick">+5</text>
  <text x="795" y="125" text-anchor="middle" class="tick">+7.5</text>
  <text x="900" y="125" text-anchor="middle" class="tick">+10</text>
  <line x1="270" y1="140" x2="270" y2="548" class="grid"/>
  <line x1="375" y1="140" x2="375" y2="548" class="grid"/>
  <line x1="480" y1="136" x2="480" y2="548" stroke="#173B57" stroke-width="2"/>
  <line x1="585" y1="140" x2="585" y2="548" class="grid"/>
  <line x1="690" y1="140" x2="690" y2="548" class="grid"/>
  <line x1="795" y1="140" x2="795" y2="548" class="grid"/>
  <line x1="900" y1="140" x2="900" y2="548" class="grid"/>

  <text x="55" y="180" class="task">Bike</text>
  <rect x="480" y="157" width="76" height="30" rx="6" fill="#237B78"/><text x="566" y="177" class="val" fill="#237B78">+1.81</text>
  <text x="55" y="235" class="task">Hull</text>
  <rect x="480" y="212" width="151" height="30" rx="6" fill="#237B78"/><text x="641" y="232" class="val" fill="#237B78">+3.59</text>
  <text x="55" y="290" class="task">JPX</text>
  <rect x="480" y="267" width="356" height="30" rx="6" fill="#237B78"/><text x="846" y="287" class="val" fill="#237B78">+8.48</text>
  <text x="55" y="345" class="task">Recruit</text>
  <rect x="358" y="322" width="122" height="30" rx="6" fill="#B27619"/><text x="348" y="342" text-anchor="end" class="val" fill="#B27619">−2.90</text>
  <text x="55" y="400" class="task">Walmart</text>
  <rect x="480" y="377" width="69" height="30" rx="6" fill="#237B78"/><text x="559" y="397" class="val" fill="#237B78">+1.63</text>
  <text x="55" y="455" class="task">Optiver</text>
  <rect x="436" y="432" width="44" height="30" rx="6" fill="#B27619"/><text x="426" y="452" text-anchor="end" class="val" fill="#B27619">−1.05</text>
  <text x="55" y="510" class="task">Web Traffic</text>
  <rect x="303" y="487" width="177" height="30" rx="6" fill="#B27619"/><text x="293" y="507" text-anchor="end" class="val" fill="#B27619">−4.21</text>

  <rect x="930" y="164" width="215" height="145" rx="14" fill="#E8F3F2"/>
  <circle cx="957" cy="194" r="7" fill="#237B78"/><text x="974" y="199" class="sub">Q-Arbor leads</text>
  <circle cx="957" cy="229" r="7" fill="#B27619"/><text x="974" y="234" class="sub">Flat Agent leads</text>
  <text x="952" y="271" class="tick">Raw metrics are never</text>
  <text x="952" y="289" class="tick">averaged across tasks.</text>

  <text x="55" y="570" class="tick">Frozen primary evidence · one formal run per arm · descriptive comparison, not an inferential effect estimate</text>
</svg>
